<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ヒステリックAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Arial", "Noto Sans JP", sans-serif;

      background:
        radial-gradient(circle at top left, #ffd6df 0%, transparent 35%),
        radial-gradient(circle at bottom right, #ff9eb5 0%, transparent 35%),
        linear-gradient(135deg, #fff0f3, #ffc2d1);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;
      overflow-x: hidden;
    }

    .container {
      position: relative;

      width: 100%;
      max-width: 760px;

      background: rgba(255, 255, 255, 0.95);

      padding: 40px;

      border-radius: 24px;
      border: 3px solid #ff4d6d;

      box-shadow:
        0 15px 40px rgba(201, 24, 74, 0.25),
        0 0 0 8px rgba(255, 255, 255, 0.4);

      z-index: 2;
    }

    .title-area {
      text-align: center;
      margin-bottom: 30px;
    }

    .title-icon {
      font-size: 48px;
      margin-bottom: 5px;

      animation: float 2s ease-in-out infinite;
    }

    h1 {
      margin: 0;

      font-size: 42px;
      font-weight: 900;

      color: #c9184a;

      text-shadow:
        2px 2px 0 #ffd6df,
        4px 4px 0 rgba(201, 24, 74, 0.08);
    }

    .subtitle {
      margin-top: 10px;
      color: #666;
      font-size: 15px;
    }

    .input-label {
      display: block;

      margin-bottom: 8px;

      font-size: 15px;
      font-weight: bold;

      color: #8d1234;
    }

    textarea {
      width: 100%;
      height: 160px;

      padding: 16px;

      font-size: 16px;
      line-height: 1.6;

      border: 2px solid #ff8fa3;
      border-radius: 14px;

      background-color: #fffafb;

      outline: none;
      resize: vertical;

      transition: 0.2s;
    }

    textarea:focus {
      border-color: #c9184a;

      box-shadow:
        0 0 0 4px rgba(201, 24, 74, 0.1);

      background-color: #ffffff;
    }

    button {
      width: 100%;

      margin-top: 18px;
      padding: 16px;

      border: none;
      border-radius: 14px;

      font-size: 19px;
      font-weight: 900;

      color: white;

      background:
        linear-gradient(135deg, #ef233c, #c9184a);

      cursor: pointer;

      box-shadow:
        0 7px 0 #8f0b2c,
        0 12px 20px rgba(201, 24, 74, 0.25);

      transition: 0.15s;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 9px 0 #8f0b2c,
        0 16px 25px rgba(201, 24, 74, 0.3);
    }

    button:active {
      transform: translateY(5px);

      box-shadow:
        0 2px 0 #8f0b2c,
        0 6px 10px rgba(201, 24, 74, 0.2);
    }

    .result-title {
      margin-top: 28px;
      margin-bottom: 8px;

      font-size: 14px;
      font-weight: bold;

      color: #c9184a;
    }

    .result {
      position: relative;

      min-height: 110px;

      padding: 22px;

      background:
        linear-gradient(135deg, #fff0f3, #ffe5ec);

      border-radius: 14px;
      border: 2px solid #ffb3c1;
      border-left: 7px solid #d90429;

      color: #7a0019;

      font-size: 18px;
      font-weight: bold;

      line-height: 1.7;

      white-space: pre-wrap;

      transition: 0.2s;
    }

    .result.active {
      animation: resultPop 0.35s ease;
    }

    .character {
      position: fixed;

      right: 30px;
      bottom: 25px;

      text-align: center;

      z-index: 3;
    }

    .speech {
      position: relative;

      display: inline-block;

      margin-bottom: 8px;
      padding: 10px 15px;

      background-color: white;

      border: 2px solid #d90429;
      border-radius: 18px;

      color: #c9184a;
      font-weight: 900;

      box-shadow:
        0 5px 14px rgba(0, 0, 0, 0.12);
    }

    .speech::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: -10px;

      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 10px solid #d90429;
    }

    .face {
      font-size: 90px;

      filter:
        drop-shadow(0 7px 8px rgba(0, 0, 0, 0.15));

      animation: characterShake 1.2s infinite;
    }

    .decor {
      position: fixed;

      font-size: 42px;

      opacity: 0.18;

      user-select: none;

      z-index: 0;
    }

    .decor1 {
      top: 12%;
      left: 7%;
      transform: rotate(-15deg);
    }

    .decor2 {
      top: 18%;
      right: 9%;
      transform: rotate(15deg);
    }

    .decor3 {
      bottom: 8%;
      left: 12%;
      transform: rotate(-10deg);
    }

    @keyframes characterShake {
      0% {
        transform: rotate(0deg);
      }

      20% {
        transform: rotate(4deg);
      }

      40% {
        transform: rotate(-4deg);
      }

      60% {
        transform: rotate(3deg);
      }

      80% {
        transform: rotate(-3deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes resultPop {
      0% {
        transform: scale(0.97);
        opacity: 0.4;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 900px) {
      .character {
        display: none;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .container {
        padding: 25px;
      }

      h1 {
        font-size: 32px;
      }
    }
    .character-select {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .character-button {
      margin-top: 0;
      padding: 12px;
      width: 50%;

      background: #fff0f3;
      color: #c9184a;

      border: 2px solid #ff8fa3;

      box-shadow: none;
    }

    .character-button:hover {
      transform: translateY(-2px);

      box-shadow: none;
    }

    .character-button.active {
      background: #c9184a;
      color: white;

      border-color: #c9184a;

      box-shadow: none;
    }
  </style>
</head>

<body>

  <div class="decor decor1">💢</div>
  <div class="decor decor2">⚡</div>
  <div class="decor decor3">💥</div>

  <div class="container">

    <div class="title-area">
      <div class="title-icon">💢</div>

      <h1>ヒステリックAI</h1>

      <p class="subtitle">
        あなたの一言に、彼女か母親がヒスって返します。
      </p>
    </div>

    <label class="input-label">
      誰にヒスられたい？
    </label>

    <div class="character-select">

      <button
        type="button"
        class="character-button active"
        data-character="彼女"
      >
        💕 彼女
      </button>

      <button
        type="button"
        class="character-button"
        data-character="母親"
      >
        👩 母親
      </button>

    </div>


    <label class="input-label">
      変換したい文章
    </label>

    <textarea
      id="userInput"
      placeholder="例：今日はバイトに行きたくない"
    ></textarea>

    <button id="sendButton">
      💥 ヒステリックにする！！
    </button>

    <div class="result-title">
      ヒステリック返答
    </div>

    <div class="result" id="result">
      ここに変換結果が表示されます。
    </div>

  </div>

  <div class="character">
    <div class="speech" id="speech">
      はやく入力してよ！！💢
    </div>

    <div class="face">
      😡
    </div>
  </div>

  <script>

    const sendButton =
      document.getElementById("sendButton");

    const userInput =
      document.getElementById("userInput");

    const result =
      document.getElementById("result");

    const speech =
      document.getElementById("speech");

        const characterButtons =
      document.querySelectorAll(".character-button");

    let selectedCharacter = "彼女";


    characterButtons.forEach((button) => {

      button.addEventListener(
        "click",
        () => {

          characterButtons.forEach(
            (button) => {
              button.classList.remove("active");
            }
          );

          button.classList.add("active");

          selectedCharacter =
            button.dataset.character;

          speech.textContent =
            `${selectedCharacter}がヒスるわよ！！💢`;

        }
      );

    });

    sendButton.addEventListener(
      "click",
      async () => {

        const text =
          userInput.value.trim();


        if (!text) {

          result.textContent =
            "文章を入力してください。";

          speech.textContent =
            "何も書いてないじゃない！！💢";

          return;

        }


        result.textContent =
          "生成中...";

        speech.textContent =
          "ちょっと待ちなさいよ！！";


        try {

          const response =
            await fetch(
              "/send_api",
              {

                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    message: text,
                    character: selectedCharacter
                  })

              }
            );


          const data =
            await response.json();


          result.textContent =
            data.response;


          result.classList.remove(
            "active"
          );

          void result.offsetWidth;

          result.classList.add(
            "active"
          );


          speech.textContent =
            "だから言ったでしょ！！💢";


        } catch (error) {

          result.textContent =
            "エラーが発生しました。";


          speech.textContent =
            "エラーって何よ！！💢";

        }

      }
    );

  </script>

</body>
</html>
